name: flutter_poetry
description: 沉浸式中国古诗词阅读、收藏、分享、AI赏析平台
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.0
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  isar_community: ^3.2.0
  isar_community_flutter_libs: ^3.2.0
  flex_color_scheme: 8.0.0
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  screenshot: ^3.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flex_seed_scheme: ^3.6.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  isar_community_generator: ^3.2.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_native_splash:
  color: '#FAFAF5'
  image: assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: '#FAFAF5'
  adaptive_icon_foreground: assets/logo.png

