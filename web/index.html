  <!-- Inline loading styles — 国风加载动画 -->
  <style>
    body {
      margin: 0;
      background-color: #FAFAF5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #1C1C1A; }
      .loader-text { color: #F0EDE5; }
    }
    .splash {
      text-align: center;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      background-color: #C9403A;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      animation: pulse 2s ease-in-out infinite;
    }
    .splash-logo span {
      font-size: 40px;
      color: #fff;
      font-weight: bold;
      font-family: "Noto Serif SC", "KaiTi", serif;
    }
    .splash-title {
      font-size: 28px;
      font-weight: bold;
      color: #1A1A1A;
      margin-bottom: 8px;
    }
    .splash-sub {
      font-size: 13px;
      color: #999;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .loader-bar {
      width: 120px;
      height: 3px;
      background: #EDE8DC;
      border-radius: 2px;
      margin: 24px auto 0;
      overflow: hidden;
    }
    .loader-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: #C9403A;
      border-radius: 2px;
      animation: loading 1.5s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash">

      <div class="splash-title">诗词</div>
      <div class="splash-sub">沉浸式古诗词阅读</div>
      <div class="loader-bar"></div>
    </div>
  </div>

  <script>
    // 移除启动屏
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.transition = 'opacity 0.3s ease-out';
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
